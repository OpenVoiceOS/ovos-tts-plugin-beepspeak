name: TTS Intelligibility

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  tts-intelligibility:
    uses: OpenVoiceOS/gh-automations/.github/workflows/tts-intelligibility.yml@dev
    secrets: inherit
    with:
      install_extras: 'test'
      test_path: 'test/end2end/test_tts_intelligibility.py'
      max_wer: '0.5'
      pre_release: true
      system_deps: ''
      # beepspeak is a novelty engine: it emits R2D2-style beeps, not words, so the
      # STT round-trip WER is legitimately ~1.0. Report the real score, don't fail.
      warn_only: true
